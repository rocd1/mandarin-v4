<div class="app-layout">

  <!-- Desktop header -->
  <div class="desktop-header">
    <app-dashboard-header
      [menuOpen]="isMenuOpen()"
      (menuToggle)="toggleMenu()"
    />
  </div>

  <!-- Main content -->
  <div class="app-body">

    <!-- Desktop sidebar, if you want to retain it -->
    @if (isMenuOpen()) {
      <nav class="sidebar" aria-label="Main navigation">
        <a
          routerLink="/app"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="toggleMenu()"
        >
          Home
        </a>

        <a
          routerLink="/learning"
          routerLinkActive="active"
          (click)="toggleMenu()"
        >
          HSK
        </a>

        <a
          routerLink="/learning"
          (click)="toggleMenu()"
        >
          Quiz
        </a>

        <div class="sidebar-divider"></div>

        <button
          type="button"
          class="logout-button"
          (click)="logout()"
        >
          Logout
        </button>
      </nav>
    }

    <main class="app-main">
      <router-outlet />
    </main>

  </div>

  <!-- Mobile bottom navigation -->
  <div class="mobile-navigation">
    <app-bottom-navigation />
  </div>

</div>
