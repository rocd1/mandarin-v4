<div class="app-layout">
  <app-dashboard-header
    [menuOpen]="isMenuOpen()"
    (menuToggle)="toggleMenu()"
  />

  <div class="app-body">
    @if (isMenuOpen()) {
      <nav
        class="sidebar"
        aria-label="Main navigation"
      >
        <a
          routerLink="/app"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="toggleMenu()"
        >
          Home
        </a>

        <a
          routerLink="/learning"
          routerLinkActive="active"
          (click)="toggleMenu()"
        >
          HSK
        </a>

        <a
          routerLink="/learning"
          (click)="toggleMenu()"
        >
          Quiz
        </a>

        <a
          routerLink="/app/progress"
          routerLinkActive="active"
          (click)="toggleMenu()"
        >
          Progress
        </a>

        <a
          routerLink="/app/profile"
          routerLinkActive="active"
          (click)="toggleMenu()"
        >
          Profile
        </a>

        <div class="sidebar-divider"></div>

        <button
          type="button"
          class="logout-button"
          (click)="logout()"
        >
          Logout
        </button>
      </nav>
    }

    <main class="app-main">
      <router-outlet />
    </main>
  </div>
</div>
