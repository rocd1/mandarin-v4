<header class="dashboard-header">

  <button
    type="button"
    class="menu-button"
    [attr.aria-label]="
      menuOpen()
        ? 'Close navigation menu'
        : 'Open navigation menu'
    "
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    {{ menuOpen() ? '✕' : '☰' }}
  </button>

  <div class="header-content">

    <span class="dashboard-title">
      {{ title() }}
    </span>

  </div>

  <a
    routerLink="/app"
    class="profile-link"
    aria-label="Profile"
  >
    Profile
  </a>

</header>
